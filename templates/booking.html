<!DOCTYPE html>
<html>
<head>
    <title>TechCare Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Icon_V2.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/Icon_V2.png') }}">
</head>

<body>

<div class="main">
    <div class="container">

        <div class="nav">
            <a href="/home">Home</a>
            <a href="/track">Track</a>
            <a href="/logout">Logout</a>
        </div>

        <h2>Book a Repair</h2>
    
        <form id="bookingForm">
            <select id="device">
                <option value="">Select Device</option>
                <option>Smartphone</option>
                <option>Laptop</option>
                <option>Television</option>
                <option>Refrigerator</option>
                <option>Washing Machine</option>
            </select>
    
            <textarea id="issue" placeholder="Describe the issue"></textarea>
    
            <select id="method">
                <option value="">Service Method</option>
                <option>Pickup</option>
                <option>Drop-off</option>
            </select>
    
            <button type="submit">Submit Booking</button>
        </form>
    
        <p id="message"></p>
    </div>
</div>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let device = document.getElementById("device").value;
    let issue = document.getElementById("issue").value;
    let method = document.getElementById("method").value;

    let message = document.getElementById("message");

    if (!device || !issue || !method) {
        message.innerText = "All fields required";
        message.className = "error";
        return;
    }

    fetch('/booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device, issue, method })
    })
    .then(res => res.json())
    .then(data => {
        if (data.message) {
            message.innerText = data.message;
            message.className = "success";
    
            alert(data.notification); // 🔥 notification popup
        } else {
            message.innerText = data.error;
            message.className = "error";
        }
    });
});
</script>
</body>
</html>
