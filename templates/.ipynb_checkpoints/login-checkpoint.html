<!DOCTYPE html>
<html>
<head>
    <title>TechCare Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Icon_V2.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/Icon_V2.png') }}">
</head>

<body>

<div id="splash">
    <img src="{{ url_for('static', filename='images/Icon_V2.png') }}" alt="logo">
    <h2>TechCare</h2>
</div>

<div class="main">
    <div class="container">

        
        <h2>Login</h2>
    
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
    
            <button type="submit">Login</button>
        </form>
    
        <p id="message"></p>

        <div class="nav">
            <a href="/register-page">Register</a>
        </div>
    </div>
</div>
    
<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let message = document.getElementById("message");

    if (!email || !password) {
        message.innerText = "All fields required";
        message.className = "error";
        return;
    }

    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.message) {
            message.innerText = data.message;
            message.className = "success";
    
            // Redirect based on role
            setTimeout(() => {
                window.location.href = data.redirect;
            }, 1000);
        } else {
            message.innerText = data.error;
            message.className = "error";
        }
    });
});
</script>

<script>
window.addEventListener("load", function() {
    setTimeout(() => {
        let splash = document.getElementById("splash");
        splash.style.opacity = "0";
        splash.style.transition = "0.5s";

        setTimeout(() => {
            splash.style.display = "none";
        }, 500);
    }, 1500);
});
</script>
    
</body>
</html>
